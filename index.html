<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Página externa de la tienda Fedde Apps: muestra la tienda (Apps Script ?page=tienda)
       sin el aviso de Google, igual que https://deliciasfedde.github.io/fedderifas/ -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Fedde Apps · Tienda de aplicaciones</title>
  <meta name="fr-version" content="2026-10-07 tienda v1">
  <meta name="description" content="Instala y actualiza las aplicaciones de Fedde directo en tu teléfono.">
  <meta name="theme-color" content="#120833">
  <link rel="icon" type="image/png" href="icono.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fedde Apps">
  <style>
    html, body { margin: 0; height: 100%; background: #120833; overflow: hidden; }
    #tienda { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #120833; }
    #cargando {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(600px 400px at 50% 40%, #3B1590, #120833); transition: opacity .4s;
    }
    #cargando img { width: 150px; animation: latido 1.4s ease-in-out infinite; }
    #cargando.fuera { opacity: 0; pointer-events: none; }
    @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div id="cargando"><img src="icono.png" alt="Fedde Apps"></div>
  <iframe id="tienda" title="Fedde Apps" allow="clipboard-write; web-share"></iframe>

  <script>
    // ===== 👉 Tu link /exec de Apps Script (el mismo de Fedde Rifas: la tienda vive en ?page=tienda) =====
    var EXEC = "https://script.google.com/macros/s/AKfycbxv23KnMMik9Zibu3rXHXPkTNAASZCoQ4b2vAhqza3bOzxPdswrpqVhKSxa0aDSTC-o/exec";

    var marco = document.getElementById("tienda");
    // Pasa lo que venga en el link (ej: ?app=fedde-rifas) a la tienda
    var extra = location.search ? "&" + location.search.slice(1) : "";
    marco.src = EXEC + "?page=tienda" + extra;
    marco.addEventListener("load", function () {
      setTimeout(function () { document.getElementById("cargando").classList.add("fuera"); }, 500);
    });

    // Mensajes que manda la tienda desde adentro
    window.addEventListener("message", function (e) {
      if (!/\.googleusercontent\.com$/i.test(e.origin)) return;   // solo la tienda de Apps Script
      var d = e.data || {};
      if (d.fa === "hola" && e.source) { e.source.postMessage({ fa: "envoltorio" }, e.origin); return; }
      if (d.fa === "ir" && d.url) {
        var u = String(d.url);
        // Solo links normales o el salto a Chrome (intent://); nunca javascript:
        if (/^(https?:|intent:)/i.test(u)) location.href = u;   // descarga del APK, versión web o abrir en Chrome
      }
    });
  </script>
</body>
</html>
